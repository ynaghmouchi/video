<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:oklch(0.98 0.006 75);
    --surface:oklch(1 0 0);
    --surface-alt:oklch(0.965 0.007 75);
    --border:oklch(0.905 0.008 70);
    --ink:oklch(0.24 0.015 50);
    --ink-soft:oklch(0.47 0.016 50);
    --ink-faint:oklch(0.63 0.012 60);
    --accent:oklch(0.47 0.11 35);
    --accent-strong:oklch(0.38 0.105 35);
    --accent-soft:oklch(0.93 0.028 40);
    --accent-ink:oklch(0.36 0.10 35);
    --green:oklch(0.56 0.13 145);
    --green-soft:oklch(0.94 0.045 145);
    --green-ink:oklch(0.40 0.11 145);
    --red-ink:oklch(0.46 0.17 25);
    --red-soft:oklch(0.94 0.055 25);
    --grey-soft:oklch(0.93 0.007 260);
    --grey-ink:oklch(0.45 0.012 260);
    --font-display:'Newsreader', 'Iowan Old Style', Georgia, serif;
    --font-sans:'Public Sans', 'Segoe UI', system-ui, sans-serif;
    --shadow-sm:0 1px 2px rgba(30,20,10,0.05), 0 1px 10px rgba(30,20,10,0.03);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .phone{width:768px;height:1024px;background:var(--bg);font-family:var(--font-sans);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;}
  .content{flex:1;padding:30px 34px 8px;display:flex;flex-direction:column;gap:20px;min-height:0;overflow-y:auto;}

  .profile-head{display:flex;align-items:center;gap:16px;}
  .avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0;}
  .profile-name{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--ink);}
  .profile-role{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
  .profile-hotel{font-size:12.5px;color:var(--ink-faint);margin-top:1px;}

  .stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;}
  .stat-value{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--ink);}
  .stat-label{font-size:12px;color:var(--ink-soft);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm);padding:18px 20px;}
  .panel-title{font-size:14.5px;font-weight:700;color:var(--ink);margin:0 0 14px;}

  .week-bar{height:10px;border-radius:999px;background:var(--grey-soft);overflow:hidden;}
  .week-fill{height:100%;background:var(--green);border-radius:999px;width:78%;}
  .week-caption{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}

  .pref-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--border);}
  .pref-row:first-child{border-top:none;}
  .pref-label{font-size:14px;font-weight:600;color:var(--ink);}
  .lang-toggle{display:flex;align-items:center;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .lang-toggle .opt{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;color:var(--ink-faint);}
  .lang-toggle .opt.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .switch{width:42px;height:24px;border-radius:999px;background:var(--green);position:relative;flex-shrink:0;}
  .switch::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;}

  .btn-logout{text-align:center;font-size:14px;font-weight:700;color:var(--red-ink);background:var(--red-soft);padding:13px;border-radius:12px;}

  .navbar{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--surface);padding:10px 8px 16px;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);}
  .nav-item svg{width:22px;height:22px;}
  .nav-item span{font-size:10.5px;font-weight:600;}
  .nav-item.active{color:var(--accent-ink);}
</style>
</helmet>

<div class="phone">
  <div class="content">

    <div class="profile-head">
      <div class="avatar-lg">F</div>
      <div>
        <div class="profile-name">Fatima</div>
        <div class="profile-role">Femme de chambre</div>
        <div class="profile-hotel">Atlas Marrakech</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><span class="stat-value">142</span><span class="stat-label">Chambres ce mois</span></div>
      <div class="stat-card"><span class="stat-value">25 min</span><span class="stat-label">Temps moyen</span></div>
      <div class="stat-card"><span class="stat-value">94%</span><span class="stat-label">Score qualité</span></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">Cette semaine</h2>
      <div class="week-bar"><div class="week-fill"></div></div>
      <div class="week-caption">31 chambres sur 40 prévues · en avance sur l'objectif</div>
    </div>

    <div class="panel">
      <div class="pref-row">
        <span class="pref-label">Langue</span>
        <div class="lang-toggle">
          <div class="opt active">FR</div>
          <div class="opt">AR</div>
        </div>
      </div>
      <div class="pref-row">
        <span class="pref-label">Notifications de tâches</span>
        <div class="switch"></div>
      </div>
    </div>

    <div class="btn-logout">Se déconnecter</div>

  </div>

  <div class="navbar">
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Mes tâches</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V11a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10"/><path d="M3 11l3-6h12l3 6"/><path d="M3 21h18"/></svg>
      <span>Chambres</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.5 18a1.5 1.5 0 0 0 1.3 2.2h16.4a1.5 1.5 0 0 0 1.3-2.2L13.7 3.9a1.5 1.5 0 0 0-2.6 0z"/></svg>
      <span>Incidents</span>
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.6 3.6-6.5 8-6.5s8 2.9 8 6.5"/></svg>
      <span>Profil</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
